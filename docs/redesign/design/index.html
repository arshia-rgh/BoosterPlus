<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>PLAYORA · Design atlas</title>
    <link rel="stylesheet" href="atlas.css" />
    <script src="data.js" defer></script>
    <script src="atlas.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#canvas">Skip design controls</a>
    <header class="reviewbar">
      <div class="reviewbrand">
        <strong>PLAYORA</strong><span>DESIGN ATLAS / 01</span>
      </div>
      <label
        >View<select id="screenSelect" aria-label="Design screen"></select
      ></label>
      <label
        >State<select id="stateSelect" aria-label="Design state"></select
      ></label>
      <label
        >Preview as<select id="identityPreview" aria-label="Preview identity">
          <option value="visitor">Visitor</option>
          <option value="customer">Signed-in customer (demo)</option>
          <option value="customer-empty">Signed in · no ongoing orders</option>
          <option value="customer-error">
            Signed in · updates unavailable
          </option>
        </select></label
      >
      <button id="inspect" aria-expanded="false" aria-controls="inspector">
        Specifications
      </button>
    </header>
    <div class="journeybar">
      <label
        >Journey<select id="flowSelect" aria-label="Journey">
          <option value="">Explore freely</option>
        </select></label
      >
      <div
        id="journeySteps"
        class="journeySteps"
        aria-label="Journey steps"
      ></div>
      <div class="widths" aria-label="Canvas width">
        <button data-width="full" aria-pressed="true">Fluid</button
        ><button data-width="768" aria-pressed="false">Tablet</button
        ><button data-width="390" aria-pressed="false">Phone</button>
      </div>
    </div>
    <div class="designnotice">
      REVIEW PROTOTYPE · Fictional data. No real sign-in, messages or payments.
      <a href="../README.md">Read the brief ↗</a>
    </div>
    <div id="stage">
      <p class="previewlabel" id="previewLabel">
        Website preview · Scroll inside the border to explore the page.
      </p>
      <div id="previewFrame" aria-describedby="previewLabel">
        <img
          id="siteBackdrop"
          src="assets/ascension.jpg"
          alt=""
          aria-hidden="true"
        />
        <div
          id="canvas"
          tabindex="0"
          role="region"
          aria-label="Website preview"
        ></div>
        <div id="orderCorner" hidden></div>
      </div>
    </div>
    <aside id="inspector" hidden aria-label="Screen specification"></aside>
    <div id="announce" class="sr-only" role="status"></div>
  </body>
</html>
