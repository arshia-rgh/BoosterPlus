<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYORA · Immersive service preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151a19;color:#eef2ef;font:14px system-ui,sans-serif}.studio{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-bottom:1px solid #ffffff1c;background:#202725}.identity{display:flex;align-items:center;gap:12px}.identity strong{letter-spacing:.12em}.identity small{color:#aebbb5}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:3px;padding:3px;border:1px solid #ffffff20;border-radius:9px}button,a{font:inherit}button{border:0;background:transparent;color:#c4d0ca;border-radius:6px;padding:9px 12px;cursor:pointer;min-height:38px}button[aria-pressed=true]{background:#d6ba88;color:#17221c}button:hover{background:#ffffff20;color:white}button:focus-visible,a:focus-visible{outline:3px solid #9eecc7;outline-offset:3px}a{color:#c3d4ca;text-underline-offset:4px}.hint{margin:0;padding:9px 22px;color:#aebbb5;font-size:12px;min-height:34px}.stage{flex:1;display:flex;justify-content:center;padding:0 16px 16px;min-height:0}iframe{display:block;box-sizing:border-box;width:100%;height:100%;border:1px solid #637068;border-radius:12px;background:#07150f;box-shadow:0 20px 60px #0005;transition:width .24s ease}iframe[data-size=tablet]{width:820px;max-width:100%}iframe[data-size=phone]{width:390px;max-width:100%}@media(max-width:820px){.toolbar{flex-direction:column;align-items:start;padding:10px 12px;gap:9px}.controls{gap:8px;width:100%}.identity small{font-size:11px}.group button{padding:8px 9px}.stage{padding:0 6px 6px}.hint{padding:8px 12px}.open{margin-left:auto;font-size:12px}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style></head><body><div class="studio">
<header class="toolbar"><div class="identity"><strong>PLAYORA</strong><small>DESIGN PREVIEW · NOT LIVE</small></div><div class="controls">
<div class="group" aria-label="Preview page"><button data-page="home" aria-pressed="true">Homepage</button><button data-page="mlbb" aria-pressed="false">MLBB game</button></div>
<div class="group" aria-label="Preview width"><button data-size="desktop" aria-pressed="true">Desktop</button><button data-size="tablet" aria-pressed="false">Tablet</button><button data-size="phone" aria-pressed="false">Phone</button></div>
<a class="open" href="page.html?view=home" target="_blank" rel="noopener">Full page ↗</a></div></header>
<p class="hint" role="status">Explore all five scenes using the tabs or arrows. Switch to MLBB to review the four service cards.</p>
<div class="stage"><iframe title="PLAYORA website design preview" src="page.html?view=home" data-size="desktop"></iframe></div></div>
<script>
const frame=document.querySelector('iframe'),params=new URLSearchParams(location.search);let page=['home','mlbb'].includes(params.get('page'))?params.get('page'):'home';let size=['desktop','tablet','phone'].includes(params.get('size'))?params.get('size'):'desktop';
function sync(reload){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));document.querySelectorAll('button[data-size]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.size===size));frame.dataset.size=size;const target='page.html?view='+page;document.querySelector('.open').href=target;if(reload)frame.src=target;history.replaceState(null,'','?page='+page+'&size='+size)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;sync(true)});document.querySelectorAll('button[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;sync(false)});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data?.type==='page'){page=e.data.page;sync(false)}if(e.data?.type==='selection')document.querySelector('.hint').textContent=e.data.name+' selected. This preview covers artwork and service selection; purchasing flows are unchanged.'});sync(true);
</script></body></html>
