# Optional encrypted off-host SQL log/snapshot backup. Enable only with private
# recovery material and an independently hosted S3 destination configured.
services:
  tikv:
    networks: [backup-egress]
    volumes: ["${BR_MASTER_KEY_FILE:?}:/backup/master.key:ro"]
  br:
    image: pingcap/br:v8.5.8@sha256:15beb655d3276fe64aa6a353f9bf3d828d34272d2470abdf5026457b754f1c45
    profiles: [tools]
    user: "1000:1000"
    read_only: true
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=128m,noexec,nosuid,uid=1000,gid=1000"]
    env_file: [{path: "${PITR_ENV_FILE:?}", format: raw}]
    volumes:
      - ${DATA_DIRECTORY:?}/pki/operations:/certs:ro
      - ${BR_MASTER_KEY_FILE:?}:/backup/master.key:ro
      - ${BR_SNAPSHOT_KEY_FILE:?}:/backup/snapshot.key:ro
    networks: [data-cluster, backup-egress]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  backup-egress: {}
