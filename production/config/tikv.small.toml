# Below the container's 3584 MiB ceiling; measurement remains required.
memory-usage-limit = "2816MB"
[log]
level = "warn"
[storage]
reserve-space = "10GB"
scheduler-worker-pool-size = 2
[storage.block-cache]
capacity = "1GB"
[readpool.unified]
min-thread-count = 1
max-thread-count = 2
[raft-engine]
memory-limit = "128MB"
[security]
ca-path = "/certs/ca.crt"
cert-path = "/certs/server.crt"
key-path = "/certs/server.key"
cert-allowed-cn = ["pd", "tikv", "tidb", "operations"]
