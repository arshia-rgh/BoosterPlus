name: ${DEPLOY_PROJECT:?Set DEPLOY_PROJECT}
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,noexec,nosuid"]
  stop_grace_period: 30s
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
x-backend: &backend
  <<: *runtime
  image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
  env_file: [{path: "${BACKEND_ENV_FILE:?Set BACKEND_ENV_FILE}", format: raw}]
  networks: [application, outbound]
  volumes: [scanner-socket:/run/clamav:ro]
  mem_limit: 384m
  cpus: 1
x-frontend: &frontend
  <<: *runtime
  env_file: [{path: "${FRONTEND_ENV_FILE:?Set FRONTEND_ENV_FILE}", format: raw}]
  environment:
    HOST: 0.0.0.0
    PORT: "3000"
    API_ORIGIN: http://api:8080
    TRUST_PROXY_CIDRS: ${GATEWAY_IP:?Set GATEWAY_IP}/32
  networks: [edge, application]
  mem_limit: 384m
  cpus: 1
  depends_on:
    api: {condition: service_healthy}
services:
  gateway:
    <<: *runtime
    image: ${GATEWAY_IMAGE:?Set immutable GATEWAY_IMAGE}
    user: "1000:1000"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:8080", "443:8443"]
    networks:
      edge: {ipv4_address: "${GATEWAY_IP:?Set GATEWAY_IP}"}
      outbound: {}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    mem_limit: 256m
    cpus: 1
    depends_on:
      storefront: {condition: service_healthy}
      admin: {condition: service_healthy}
  storefront:
    <<: *frontend
    image: ${STOREFRONT_IMAGE:?Set immutable STOREFRONT_IMAGE}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      FRONTEND_APP: storefront
      API_ORIGIN: http://api:8080
      TRUST_PROXY_CIDRS: ${GATEWAY_IP:?Set GATEWAY_IP}/32
  admin:
    <<: *frontend
    image: ${ADMIN_IMAGE:?Set immutable ADMIN_IMAGE}
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      FRONTEND_APP: admin
      API_ORIGIN: http://api:8080
      TRUST_PROXY_CIDRS: ${GATEWAY_IP:?Set GATEWAY_IP}/32
  api:
    <<: *backend
    environment: {HTTP_ADDR: "0.0.0.0:8080"}
  worker:
    <<: *backend
    entrypoint: [/app/worker]
    healthcheck:
      test: [CMD, /app/boosterplus, dependencies, ready]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      api: {condition: service_healthy}
      scanner: {condition: service_started}
  migrate:
    <<: *runtime
    image: ${BACKEND_IMAGE:?Set immutable BACKEND_IMAGE}
    restart: "no"
    profiles: [tools]
    env_file: [{path: "${MIGRATION_ENV_FILE:?Set MIGRATION_ENV_FILE}", format: raw}]
    entrypoint: [/app/boosterplus]
    command: [db, migrate, status]
    healthcheck: {disable: true}
    networks: [outbound]
    mem_limit: 256m
    cpus: 1
  scanner:
    <<: *runtime
    image: ${SCANNER_IMAGE:?Set immutable SCANNER_IMAGE}
    platform: linux/amd64
    # Upstream needs root to initialize signatures/socket and then drops daemon privileges.
    read_only: false
    cap_drop: []
    environment:
      CLAMD_CONF_LocalSocketMode: "666"
      CLAMD_CONF_TCPAddr: 127.0.0.1
      CLAMD_CONF_StreamMaxLength: 4M
      CLAMD_CONF_MaxFileSize: 4M
      CLAMD_CONF_MaxScanSize: 16M
      CLAMD_CONF_MaxScanTime: "10000"
      CLAMD_CONF_MaxRecursion: "4"
      CLAMD_CONF_MaxFiles: "20"
      CLAMD_CONF_MaxThreads: "2"
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - scanner-data:/var/lib/clamav
      - scanner-socket:/run/clamav
    networks: [outbound]
    mem_limit: 2g
    cpus: 1
networks:
  edge:
    internal: true
    ipam:
      config: [{subnet: "${EDGE_SUBNET:?Set EDGE_SUBNET}", ip_range: "${EDGE_DYNAMIC_RANGE:?Set EDGE_DYNAMIC_RANGE}"}]
  application: {internal: true}
  outbound: {}
volumes:
  gateway-data: {}
  gateway-config: {}
  scanner-data: {}
  scanner-socket: {}
