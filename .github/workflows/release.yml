name: Build production release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-artifacts
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install checksum-pinned image scanner
        run: python3 scripts/install-trivy.py
      - name: Authenticate artifact registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Require exact-commit full CI, build and scan immutable artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 production/deploy/build_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: .cache/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner registry credentials
        if: always()
        run: docker logout ghcr.io
