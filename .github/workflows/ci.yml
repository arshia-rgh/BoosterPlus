name: Quality and security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Owner policy, 5 October 2026: hosted CI is service-free. Heavy database,
    # browser and production runtime qualification is explicit on the server.
    timeout-minutes: 60
    env:
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned static and security tools
        run: |
          make -C backend bootstrap
          cd backend
          GOBIN="$GITHUB_WORKSPACE/.tools" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          GOBIN="$GITHUB_WORKSPACE/.tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Install locked frontend dependencies
        run: make -C frontend install
      - name: Repository policy, secrets, workflow and contracts
        run: make check-repository
      - name: Backend static, security, race unit tests and builds
        run: make -C backend stage-check
      - name: Frontend static, security, component tests and builds
        run: make -C frontend stage-check
      - name: Deployment unit tests and configuration validation without service startup
        run: make -C production preparation-check
