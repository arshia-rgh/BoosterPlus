name: Quality and security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned tools and dependencies
        run: make bootstrap
      - name: Install browser system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run local service setup and smoke checks
        run: make -C backend dev-up dev-smoke
      # Same complete gate as root pre-commit, sequenced so CI's disposable
      # development database/scanner do not compete with the real-TiKV drill.
      - name: Repository gate
        run: make check-repository
      - name: Complete backend gate
        run: make -C backend pre-commit
      - name: Complete frontend gate
        run: make -C frontend pre-commit
      - name: Release CI fixture memory before deployment qualification
        working-directory: backend
        run: docker compose --profile storage stop
      - name: Complete production gate including real TiKV and infrastructure audits
        run: make -C production pre-commit
      - name: Stop isolated CI services
        if: always()
        working-directory: backend
        run: DEV_S3_SECRET_KEY=configuration-validation-only docker compose --profile storage down
